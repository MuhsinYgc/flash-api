# App name is set on first `fly launch` (or rename `app` below).
# Show state is in-memory: run exactly ONE machine (`fly scale count 1 -a flash-api-dkiqeq`).
app = "flash-api-dkiqeq"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every phone holds a WebSocket open. Fly's default (hard_limit 25) would queue the rest.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 2000
    hard_limit = 2500

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
